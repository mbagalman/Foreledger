[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foreledger"
version = "0.1.0.dev0"
description = "Foreledger — a durable archive of recurring forecast runs with horizon-keyed accuracy evaluation, cross-model/version comparison, and origin-scoped as-of queries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Michael Bagalman", email = "michael@paradoxresolution.com" }]
keywords = ["forecasting", "forecast-evaluation", "time-series", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.0,<2.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs",
    "build",
]
polars = ["polars>=1.0"]
# snowflake extra arrives with the v1.1 warehouse backend (Phase 6)

[project.urls]
Repository = "https://github.com/mbagalman/Foreledger"

[tool.hatch.build.targets.wheel]
packages = ["src/foreledger"]

[tool.hatch.build.targets.sdist]
# ship what a consumer or distro packager needs (source, tests, user docs,
# examples, doc-check scripts) — not repo/agent tooling or internal ADRs
exclude = [".claude", ".github", "AGENTS.md", "docs/internal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# matplotlib is an optional, runtime-guarded import (AccuracyCurve.plot)
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
