name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -q
      - name: Quickstart check
        run: python examples/quickstart.py

  package:
    # Release-gate checks: the built wheel works in a clean environment,
    # the documented quick start runs as written, doc links resolve, and
    # time-to-first-value stays within the documented bound.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Clean-env install + quickstart (time-to-first-value gate)
        run: |
          python -m venv fresh
          ./fresh/bin/pip install dist/*.whl
          start=$(date +%s)
          ./fresh/bin/python examples/quickstart.py
          elapsed=$(( $(date +%s) - start ))
          echo "time-to-first-value: ${elapsed}s"
          test "$elapsed" -le 900
      - name: Quickstart guide executes verbatim
        run: ./fresh/bin/python scripts/check_quickstart_doc.py
      - name: Doc links resolve
        run: python scripts/check_doc_links.py
